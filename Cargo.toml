[package]
name = "cce-calendar"
version = "0.1.0"
edition = "2021"

[dependencies]
cce-ui = { git = "https://git.lucas.co/cce-ui.git", rev = "b437ebd15d4e3ab8e160f1740137c69de4f0c5a3" }
calloop = "0.13.0"
wayland-client = { version = "0.31", features = ["system"] }
chrono = "0.4"
kdl = "4.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
# cce-calendar-sync only: CalDAV against iCloud, credentials from the same
# keyring service cce-mail uses.
reqwest = { version = "0.12", features = ["blocking", "json"] }
roxmltree = "0.20"
chrono-tz = "0.10"
keyring = { version = "3", features = ["sync-secret-service"] }

# The month-view app; src/bin/sync.rs adds the cce-calendar-sync helper,
# which ccebuild discovers via cargo metadata like any other [[bin]].
[[bin]]
name = "cce-calendar"
path = "src/main.rs"

[[bin]]
name = "cce-calendar-sync"
path = "src/bin/sync.rs"
