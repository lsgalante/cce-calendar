[package]
name = "cce-calendar"
version = "0.1.0"
edition = "2021"

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "3c5b1fde4e8c4115b6f2666f8e661da9bc9a2850" }
cce-vault = { git = "https://github.com/lsgalante/cce-vault.git", rev = "3a7348a77ea6381d63b7358d14baf155637a7e38" }
calloop = "0.13.0"
wayland-client = { version = "0.31", features = ["system"] }
chrono = "0.4"
kdl = "4.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
# cce-calendar-sync only: CalDAV against iCloud, credentials from the same
# keyring service cce-mail uses.
reqwest = { version = "0.12", features = ["blocking", "json"] }
roxmltree = "0.20"
chrono-tz = "0.10"
keyring = { version = "3", features = ["sync-secret-service"] }

# The month-view app; src/bin/sync.rs adds the cce-calendar-sync helper,
# which ccebuild discovers via cargo metadata like any other [[bin]].
[[bin]]
name = "cce-calendar"
path = "src/main.rs"

[[bin]]
name = "cce-calendar-sync"
path = "src/bin/sync.rs"
